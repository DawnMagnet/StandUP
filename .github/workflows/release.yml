name: Release

# Builds the lite, standard and full (Native AOT) installers on Windows.
# A pushed v* tag attaches them to that tag's GitHub release; a manual run only uploads them as artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build installers
        shell: pwsh
        run: ./build/release.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: installers
          path: installer/Output/StandUP-Setup-*.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --title "StandUP $($tag.TrimStart('v'))" --generate-notes }
          gh release upload $tag (Get-ChildItem installer/Output/StandUP-Setup-*.exe).FullName --clobber
